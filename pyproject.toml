[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chgk-rating"
version = "0.1.0"
description = "Dual Latent Embedding Rating System for ChGK (What? Where? When?)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "scikit-learn>=1.4.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
chgk-rating = "chgk_rating.cli:cli"
