[project]
name = "chgk-sync"
version = "0.1.0"
description = "App Engine service: daily ChGK downloads and a Telegram webhook"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
    "google-cloud-datastore>=2.20.0",
    "google-cloud-tasks>=2.16.0",
    "google-cloud-storage>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # Local upload/materialize only. uv export --no-dev keeps them out of App Engine.
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[tool.uv]
package = false
