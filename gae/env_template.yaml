env_variables:
  PROJECT_ID: '<YOUR_PROJECT_ID>'
  TELEGRAM_API_TOKEN: '<YOUR_TELEGRAM_API_TOKEN>'
  OBFUSCATION_TOKEN: '<YOUR_WEBHOOK_OBFUSCATION_TOKEN>'
  ADMIN_CHAT_ID: '<YOUR_ADMIN_CHAT_ID>'
