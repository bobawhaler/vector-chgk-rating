[project]
name = "chgk-questions"
version = "0.1.0"
description = "Analysis of the ChGK question corpus from gotquestions.online"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "click>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.uv]
package = false
